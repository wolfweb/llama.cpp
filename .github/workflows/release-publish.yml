name: Publish Release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - sensenova-loop-model

run-name: "Publish ${{ github.event.workflow_run.display_title }}"

cache-mode: none
permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: sensenova-loop-model

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Fine-grained permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
        actions: read
        contents: write # for creating release
        id-token: write
        attestations: write

    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.name }}

    steps:
      - id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if echo "$COMMIT_MESSAGE" | grep -q '\[no release\]'; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_RELEASE }}

      - name: Determine tag name
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: download-artifact
        uses: actions/download-artifact@v8
        with:
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          skip-decompress: true

      - name: Merge artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: move_artifacts
        run: |
          mkdir -p release

          echo "Renaming and moving zips to release..."
          for zip_file in artifact/llama-bin-win-*.zip; do
            base_name=$(basename "$zip_file" .zip)
            zip_name="llama-${{ steps.tag.outputs.name }}-${base_name#llama-}.zip"
            echo "Moving $zip_file to release/$zip_name"
            mv "$zip_file" "release/$zip_name"
          done

          echo "Moving other artifacts..."
          rm -f artifact/llama-ui.zip
          mv -v artifact/*.zip release
          mv -v artifact/*.tar.gz release

      - name: Download UI build
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: download_ui
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: ./ui-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package UI
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: package_ui
        run: |
          tar -czvf release/llama-${{ steps.tag.outputs.name }}-ui.tar.gz --transform "s,^\.,llama-${{ steps.tag.outputs.name }}," -C ./ui-dist .

      - name: Attest release artifacts
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'

      - name: Create release
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: create_release
        uses: ggml-org/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          body: |
            <details open>

            ${{ github.event.workflow_run.head_commit.message }}

            </details>

            **Website:**
            - <https://llama.app>

            **Attestations:**
            - <${{ steps.attest.outputs.attestation-url }}>

            **Windows (CUDA 12.4, x64):**
            - [llama.cpp Windows x64 (CUDA 12.4)](https://github.com/wolfweb/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/llama-${{ steps.tag.outputs.name }}-bin-win-cuda-12.4-x64.zip)
            - [CUDA 12.4 runtime DLLs](https://github.com/wolfweb/llama.cpp/releases/download/${{ steps.tag.outputs.name }}/cudart-llama-bin-win-cuda-12.4-x64.zip)

            Built from `OpenSenseNova/llama.cpp@24ea7bb` (SenseNova Loop MTP support).


      - name: Upload release
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: upload_release
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const path = require('path');
            const fs = require('fs');
            const release_id = '${{ steps.create_release.outputs.id }}';
            for (let file of await fs.readdirSync('./release')) {
              if (path.extname(file) === '.zip' || file.endsWith('.tar.gz')) {
                console.log('uploadReleaseAsset', file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  name: file,
                  data: await fs.readFileSync(`./release/${file}`)
                });
              }
            }

  ui-publish:
    if: false

    needs:
      - publish

    uses: ./.github/workflows/ui-publish.yml
    with:
      version_tag: ${{ needs.publish.outputs.tag_name }}
      run_id: ${{ github.event.workflow_run.id }}
    secrets:
      hf_token: ${{ secrets.HF_TOKEN_UI_STATIC_OUTPUT }}
